version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: tix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    # Listing files replaces GoReleaser's defaults, which cover LICENSE and
    # README but not NOTICE. Apache-2.0 section 4(d) expects NOTICE to travel
    # with the distribution.
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"
